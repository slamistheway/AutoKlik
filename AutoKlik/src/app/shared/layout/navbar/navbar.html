<nav class="bg-(--color-navbar) drop-shadow-xl">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between items-center h-12">

      <!-- Logo -->
      <div class="shrink-0">
        <a routerLink="/" class="flex items-center">
          <span class="text-2xl font-bold text-white">AutoKlik</span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex md:items-center md:space-x-2">
        <a routerLink="/checkout"
           class="text-red-50 hover:text-red-200 px-3 py-2 text-sm font-medium ">
          Objavi oglas
        </a>
        @if (!(currentUser$ | async)) {
          <a routerLink="/login"
             class="text-red-50 hover:text-red-200 px-3 py-2 text-sm font-medium ">
            Log In
          </a>
        }

        @if (currentUser$ | async; as user) {
          <div class="relative">
            <button
              type="button"
              (click)="toggleProfileDropdown()"
              class="flex items-center gap-2 text-red-50 hover:text-red-200 cursor-pointer px-3 py-2 text-sm font-medium "
            >
              <img [src]="getProfileImageUrl(user)" alt="Profile" class="h-6 w-6 rounded-full object-cover">
              <span>
                {{ user.username }}
              </span>
              <span class="mr-2">{{ isProfileDropdownOpen ? '▲' : '▼' }}</span>
            </button>

            @if (isProfileDropdownOpen) {
              <div
                class="absolute right-0 mt-2 w-40 rounded-md border border-red-700 bg-(--color-footer) shadow-lg z-60"
              >
                <a routerLink="/my-profile"
                  type="button"
                  (click)="onMyProfileClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-red-50 hover:bg-red-600 "
                >
                  My Profile
                </a>
                <a routerLink="/my-settings"
                  type="button"
                  (click)="onSettingsClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-red-50 hover:bg-red-600 "
                >
                  Settings
                </a>
                <a routerLink="/"
                  type="button"
                  (click)="onLogoutClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-red-50 hover:bg-red-600 "
                >
                  Logout
                </a>
              </div>
            }
          </div>
        }
      </div>

      <!-- Mobile Button -->
      <div class="md:hidden">
        <button (click)="toggleMenu()"
                class="text-red-50 hover:text-red-200 focus:outline-none focus:ring-2 focus:ring-red-300 rounded-md p-2">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (!isMenuOpen) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            }
            @if (isMenuOpen) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            }
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen) {
    <div class="md:hidden bg-(--color-footer) rounded-b-xl">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">

        <a routerLink="/"
           class="block px-3 py-2 rounded-md text-base font-medium text-red-50 hover:bg-red-600 hover:text-white ">
          Home
        </a>
        @if (!(currentUser$ | async)) {
          <a routerLink="/login"
             class="block px-3 py-2 rounded-md text-base font-medium text-red-50 hover:bg-red-600 hover:text-white ">
            Log In
          </a>
        }
        @if (currentUser$ | async) {
          <button type="button" (click)="onLogoutClick()"
                  class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-red-50 hover:bg-red-600 hover:text-white ">
            Logout
          </button>
        }
      </div>
    </div>
  }
</nav>
