
<!-- ŽUPANIJA -->
<div class="span-1 flex flex-col gap-3">
  <h1 class="w-full text-center">Županija</h1>
  <div class="relative">
    <button
      type="button"
      (click)="toggleDropdown()"
      class="w-full  border-2 border-(--border-color) -mt-2 px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-(--color-navbar) focus:border-(--color-navbar) flex items-center justify-between"
    >
      @if (isSingleMode) {
        <span>{{ selectedCounties[0] || 'Županija' }}</span>
      } @else {
        <span class="flex flex-wrap gap-1">
          @if (selectedCounties.length === 0) {
            Županija
          } @else {
            @for (zupanija of selectedCounties; track $index) {
              <span
                class="flex items-center gap-1 bg-(--color-selectedListItem) text-(--color-text)  px-2 py-0.5 text-xs">
                <span>{{ zupanija }}</span>
                <button
                  type="button"
                  (click)="selectCounty({label: zupanija, value: zupanija}); $event.stopPropagation()">
                  &#x2715;
                </button>
              </span>
            }
          }
        </span>
      }

      <span class="flex items-center gap-2">
        <fa-icon [icon]="faChevronDown"></fa-icon>
      </span>
    </button>


    <!-- Dropdown Menu -->
    @if (dropdowns[dropdownKey]) {
      <div class="absolute p-3 z-10 mt-1 w-full bg-(--color-surface) border border-(--border-color)  shadow-lg max-h-60 overflow-y-auto">
        <div class="relative w-full mb-2">
          <fa-icon
            [icon]="faSearch"
            class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
          ></fa-icon>

          <input
            type="text"
            placeholder="Pretrazi zupaniju"
            [value]="countySearchTerm"
            (input)="onCountySearchInput($event)"
            class="w-full border-2 border-(--border-color) pl-10 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-(--color-navbar) focus:border-(--color-navbar)"
          >
        </div>

        @for (county of filteredCounties; track $index) {
          <button
            type="button"
            (click)="selectCounty(county)"
            class="flex items-center w-full gap-2 px-4 py-2 text-sm hover:bg-(--color-accent-soft) hover:text-(--color-navbar)  cursor-pointer"
          >
            @if (!isSingleMode) {
              <input type="checkbox" [checked]="selectedCounties.includes(county.label)">
            }
            <span>{{ county.label }}</span>
          </button>
        }

        @if (filteredCounties.length === 0) {
          <p class="px-2 py-2 text-sm text-gray-500">
            Nema rezultata za pretragu.
          </p>
        }
      </div>
    }
  </div>
</div>
