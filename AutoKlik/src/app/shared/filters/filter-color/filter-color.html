<!-- BOJA -->
<div class="span-1 flex flex-col gap-3">
  <h1 class="w-full text-center">Boja</h1>
  <div class="relative">
    <button
      type="button"
      (click)="toggleDropdown()"
      class="w-full  border-2 border-(--border-color) -mt-2 px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-(--color-navbar) focus:border-(--color-navbar) flex items-center justify-between"
      aria-label="Color options">
      @if (isSingleMode) {
        <span class="flex items-center gap-2">
          @if (selectedColors.length > 0) {
            <span class="h-3 w-3 rounded-full border border-(--border-color)" [style.background-color]="Colors.find(c => c.label === selectedColors[0])?.value || 'var(--color-accent-soft)'"></span>
          }
          <span>{{ selectedColors[0] || 'Boja' }}</span>
        </span>
      } @else {
        <span class="flex flex-wrap gap-1">
          @if (selectedColors.length === 0) {
            Boja
          } @else {
            @for (color of selectedColors; track $index) {
              <span
                class="flex items-center gap-1 bg-(--color-selectedListItem) text-(--color-text)  px-2 py-0.5 text-xs">
                <span class="h-3 w-3 rounded-full border border-(--border-color)" [style.background-color]="Colors.find(c => c.label === color)?.value || 'var(--color-accent-soft)'"></span>
                <span>{{ color }}</span>
                <button
                  type="button"
                  (click)="selectColor(Colors.find(c => c.label === color)!); $event.stopPropagation()">
                  &#x2715;
                </button>
              </span>
            }
          }
        </span>
      }

      <span class="flex items-center gap-2">
        <fa-icon [icon]="faChevronDown"></fa-icon>
      </span>
    </button>

    @if (dropdowns[dropdownKey]) {
      <div class="absolute p-3 z-10 mt-1 w-full bg-(--color-surface) border border-(--border-color)  shadow-lg max-h-60 overflow-y-auto">
        <div class="grid grid-cols-6 gap-2">
          @for (option of Colors; track $index) {
            <button
              type="button"
              (click)="selectColor(option)"
              class="relative h-7 w-7 rounded-full border-2 hover:scale-105 transition-transform"
              [style.border-color]="selectedColors.includes(option.label) ? 'var(--color-navbar)' : 'var(--border-color)'"
              [style.background-color]="option.value"
              [attr.aria-label]="option.label"
              [attr.title]="option.label">
              @if (selectedColors.includes(option.label)) {
                <span class="absolute inset-0 flex items-center justify-center text-white font-bold text-sm">✓</span>
              }
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
