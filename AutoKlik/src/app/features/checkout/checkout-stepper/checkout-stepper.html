<!-- Stepper -->
<div class="flex items-center justify-center mb-8">
  <div class="flex w-full max-w-xl">
    @for (step of steps; track $index) {
      <div class="flex-1 flex flex-col items-center">
        <a
          href=""
          (click)="$event.preventDefault(); onStepClick(step)"
          class="flex flex-col items-center select-none transition-opacity"
          [attr.aria-disabled]="isStepDisabled(step)"
          [tabIndex]="isStepDisabled(step) ? -1 : 0"
          [ngClass]="{
            'opacity-50 cursor-not-allowed pointer-events-none': isStepDisabled(step),
            'cursor-pointer': !isStepDisabled(step)
          }"
        >
          <div
            [ngClass]="{
              'bg-red-600 text-white': currentStep === step,
              'bg-gray-300 text-gray-700': currentStep !== step
            }"
            class="rounded-full w-8 h-8 flex items-center justify-center font-bold mb-1"
          >
            {{ step }}
          </div>
          <div
            class="text-xs font-medium text-center"
            [ngClass]="{
              'text-red-700': currentStep === step
            }"
          >
            {{ getStepLabel(step) }}
          </div>
        </a>
      </div>
      @if ($index < 2) {
        <div class="flex items-center w-8 h-1 bg-gray-300 mx-1"></div>
      }
    }
  </div>
</div>
